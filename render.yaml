services:
  - type: web
    name: telecom-tower-service
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn src.app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: MODEL_PATH
        value: artifacts/model_v1.0.0.joblib
