global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "/etc/prometheus/alert_rules.yml"

scrape_configs:
  - job_name: "telecom-tower-service"
    metrics_path: "/metrics"
    scrape_interval: 3s
    static_configs:
      - targets: ["tower-service:8000"]
        labels:
          environment: "production"
          service: "tower-failure-api"
